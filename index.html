<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Instagram Reels Video Downloader</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f0f2f5;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .container {
            background: #ffffff;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 400px;
            text-align: center;
        }
        h2 {
            color: #E1306C;
            margin-bottom: 20px;
        }
        input[type="text"] {
            width: 100%;
            padding: 12px;
            margin-bottom: 15px;
            border: 1px solid #ccc;
            border-radius: 6px;
            box-sizing: border-box;
            font-size: 14px;
        }
        button {
            background-color: #E1306C;
            color: white;
            border: none;
            padding: 12px 20px;
            width: 100%;
            border-radius: 6px;
            font-size: 16px;
            cursor: pointer;
            font-weight: bold;
        }
        button:hover {
            background-color: #C13584;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>Instagram Downloader</h2>
    <input type="text" id="urlInput" placeholder="यहाँ Instagram Link पेस्ट करें...">
    <button onclick="downloadVideo()">Download</button>
</div>

<script>
    function downloadVideo() {
        const url = document.getElementById('urlInput').value;
        if(!url) {
            alert('कृपया पहले लिंक पेस्ट करें!');
            return;
        }
        alert('सुविधा जल्द ही सक्रिय होगी!');
    }
</script>

</body>
</html>
